<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sophia Xu — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

    /* ── Layer 1: PNG background ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: url('images/cover-bg.png') center / cover no-repeat;
    }

    /* ── Layer 2: canvas grain ── */
    #grain {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      opacity: 0.42;
    }

    /* ── Layer 3: vignette ── */
    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse 88% 88% at 50% 50%,
        transparent 38%, rgba(0,0,0,0.38) 100%);
    }

    /* ── Layer 4: content ── */
    .stage {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px;
    }

    .pre-title {
      font-size: clamp(18px, 2.1vw, 23px); font-weight: 400;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: rgba(255,252,244,0.96); margin-bottom: 4px;
      opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    .name {
      font-family: 'Ephesis', cursive;
      font-weight: 400;
      font-size: clamp(80px, 10vw, 130px);
      color: rgba(255,252,244,0.96);
      line-height: 1; letter-spacing: 0.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.08), 0 3px 28px rgba(0,0,0,0.22);
      margin-bottom: 0px;
      opacity: 0; animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.15s forwards;
    }

    .post-title {
      font-size: clamp(18px, 2.1vw, 23px); font-weight: 400;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: rgba(255,252,244,0.96);
      margin-top: 20px; margin-bottom: 52px;
      opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.45s forwards;
    }

    .pw-area {
      opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.65s forwards;
    }

    .pw-btn {
      display: block;
      width: clamp(280px, 28vw, 400px); padding: 15px 32px;
      border: 1.5px solid rgba(255,252,244,0.75); background: rgba(255,252,244,0.06);
      font-family: 'Inter', sans-serif;
      font-size: clamp(10px, 1vw, 12px); font-weight: 500;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: rgba(255,252,244,0.96); cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
    }
    .pw-btn:hover { background: rgba(255,252,244,0.14); border-color: rgba(255,252,244,1); }

    .pw-form { display: none; flex-direction: column; align-items: center; }
    .pw-form.visible { display: flex; }

    .pw-input {
      width: clamp(280px, 28vw, 400px); padding: 15px 24px;
      border: 1.5px solid rgba(255,252,244,0.75); border-bottom: none;
      background: rgba(255,252,244,0.12);
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400;
      letter-spacing: 0.22em; color: rgba(255,252,244,0.98);
      text-align: center; outline: none;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s, border-color 0.2s;
    }
    .pw-input::placeholder { color: rgba(255,252,244,0.5); letter-spacing: 0.22em; }
    .pw-input:focus { background: rgba(255,252,244,0.18); border-color: rgba(255,252,244,1); }
    .pw-input.error { border-color: rgba(255,100,80,0.9); animation: shake 0.35s ease; }

    .pw-submit {
      width: clamp(280px, 28vw, 400px); padding: 12px 24px;
      border: 1.5px solid rgba(255,252,244,0.75);
      background: rgba(255,252,244,0.08);
      font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: rgba(255,252,244,0.85); cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .pw-submit:hover { background: rgba(255,252,244,0.18); color: rgba(255,252,244,1); }

    .product-designer {
      font-size: clamp(13px, 1.45vw, 16px); font-weight: 500;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: rgba(255,252,244,0.96);
      margin-top: 48px;
      opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.8s forwards;
    }

    .bottom-tags {
      font-size: clamp(10px, 1.1vw, 12px); font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,252,244,0.96);
      margin-top: 20px;
      opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
    }

    .page-fade { animation: pageFade 0.7s ease forwards !important; }
    @keyframes pageFade { to { opacity: 0; } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  </style>
</head>
<body>

  <div class="bg" id="bg"></div>
  <canvas id="grain"></canvas>
  <div class="vignette" id="vignette"></div>

  <div class="stage" id="stage">
    <div class="pre-title">Welcome to</div>
    <div class="name">Sophia Xu's</div>
    <div class="post-title">Portfolio</div>

    <div class="pw-area">
      <button class="pw-btn" id="pwBtn" onclick="showForm()">Enter password to view</button>
      <form class="pw-form" id="pwForm" onsubmit="checkPw(event)">
        <input class="pw-input" id="pwInput" type="password"
               placeholder="password" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button type="submit" class="pw-submit">Enter →</button>
      </form>
    </div>

    <div class="product-designer" id="productDesigner">Product Designer</div>

    <div class="bottom-tags" id="bottomTags">
      Human-Centered AI &nbsp;|&nbsp; Caregiving &nbsp;|&nbsp; Multi-Sided Product Systems
    </div>
  </div>

  <script>
    // ── Canvas grain ──
    const canvas = document.getElementById('grain');
    const ctx    = canvas.getContext('2d');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    function drawGrain() {
      const w = canvas.width, h = canvas.height;
      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 36;
      }
      ctx.putImageData(img, 0, 0);
      requestAnimationFrame(drawGrain);
    }
    drawGrain();

    // ── Password ──
    const PW = "sophiaxu";

    function showForm() {
      document.getElementById('pwBtn').style.display = 'none';
      document.getElementById('pwForm').classList.add('visible');
      setTimeout(() => document.getElementById('pwInput').focus(), 40);
    }

    function checkPw(e) {
      e.preventDefault();
      const input = document.getElementById('pwInput');
      if (input.value.trim() === PW) {
        sessionStorage.setItem('sx-auth', '1');
        ['bg','grain','vignette','stage','productDesigner','bottomTags'].forEach(id =>
          document.getElementById(id).classList.add('page-fade')
        );
        setTimeout(() => { window.location.href = 'portfolio.html'; }, 700);
      } else {
        input.classList.add('error');
        input.value = '';
        setTimeout(() => input.classList.remove('error'), 500);
        input.focus();
      }
    }

    if (sessionStorage.getItem('sx-auth') === '1') {
      window.location.replace('portfolio.html');
    }
  </script>
</body>
</html>
